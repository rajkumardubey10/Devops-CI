name: Merge CI Pipeline

on:
  push:
    branches: [ assessment ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

jobs:
  Sonarqube-Scan:
    name: SonarQube Scan
    runs-on: self-hosted

    steps:
        - name: Checkout repository 
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
   
        - name: SonarQube Scan file
          uses: sonarsource/sonarqube-scan-action@v2
          with:
            projectBaseDir: .
            args: >
                -Dsonar.projectName=My-Project
                -Dsonar.projectKey=my-projectkey
                -Dsonar.sources=src
                -Dsonar.exclusions=**/__pycache__/**,**/*.pyc,**/.github/**
                -Dsonar.verbose=true
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

        - name: SonarQube Quality Gate check
          id: sonarqube-quality-gate-check
          uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }} 
        
  Docker-Build-and-Push:
    runs-on: ubuntu-latest
    needs: Sonarqube-Scan
    outputs:
      app_changed: ${{ steps.changes.outputs.app }}
        
    steps:

      - name: Checkout repository 
        uses: actions/checkout@v4

      - name: Detect app changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'src/Dockerfile'
              - 'requirements.txt'
      
      - name: Login to Docker Hub
        if: steps.changes.outputs.app == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up QEMU
        if: steps.changes.outputs.app == 'true'
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        if: steps.changes.outputs.app == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push
        if: steps.changes.outputs.app == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: rajkumardockerhub/fastapi-app-multistage:${{ github.sha }}
          file: ./src/Dockerfile    

  Trivy-Image-Scanning:
    name: Trivy image Scan
    runs-on: ubuntu-latest
    needs: Docker-Build-and-Push
    outputs:
      app_changed: ${{ needs.Docker-Build-and-Push.outputs.app_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: needs.Docker-Build-and-Push.outputs.app_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner in fs mode
        if: needs.Docker-Build-and-Push.outputs.app_changed== 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
            scan-type: image
            scan-ref: rajkumardockerhub/fastapi-app-multistage:${{ github.sha }}
            format: table
            exit-code: '1'
            ignore-unfixed: true
            vuln-type: 'os,library'
            severity: 'CRITICAL'
  
  Checkout-CD-Repo:
    name: Getting the access of CD repo
    runs-on: self-hosted
    needs: Trivy-Image-Scanning

    steps:
      - name: Update-GitOps-Manifest
        if: needs.Trivy-Image-Scanning.outputs.app_changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: rajkumardubey10/CD-repo-for-Gitops
          ref: assessment
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: manifests

      - name: Update image tag using yq
        if: needs.Trivy-Image-Scanning.outputs.app_changed == 'true'
        run: |
          yq -i '
            .spec.template.spec.containers[0].image =
            "rajkumardockerhub/fastapi-app-multistage:${{ github.sha }}"
          ' manifests/K8/deployment.yml

      - name: Commit and push manifest update
        if: needs.Trivy-Image-Scanning.outputs.app_changed == 'true'
        run: |
          cd manifests
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update image tag to ${{ github.sha }}"
          git push origin assessment

  Staging-Verification:
    name: Staging Smoke Test
    runs-on: self-hosted
    needs: Checkout-CD-Repo

    steps:
      - name: Check Kubernetes rollout
        run: |
          kubectl rollout status deployment/fastapi-deployment --timeout=180s

      - name: Smoke test staging
        run: |
          curl --fail --retry 10 --retry-delay 5 \
            http://localhost:30000/health

  Production-Approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: Staging-Verification
    environment:
      name: production

    steps:
      - name: Approval gate passed
        run: echo "Production approval received from GitHub Environment protection rule."
  
  Production-Deployment:
    name: Deploy to Production
    runs-on: self-hosted
    needs: Staging-Verification

    environment:
      name: production

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: rajkumardubey10/CD-repo-for-Gitops
          ref: assessment
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: manifests

      - name: Update production image
        run: |
          yq -i '
            .spec.template.spec.containers[0].image =
            "rajkumardockerhub/fastapi-app-multistage:${{ github.sha }}"
          ' manifests/K8/production/deployment.yml

      - name: Commit and push production manifest
        run: |
          cd manifests
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Deploy ${{ github.sha }} to production"
          git push origin assessment


  Slack-Notification:
    name: Slack Notification
    runs-on: ubuntu-latest
    if: always()
    needs:
      - Sonarqube-Scan
      - Docker-Build-and-Push
      - Trivy-Image-Scanning
      - Checkout-CD-Repo
      - Staging-Verification
      - Production-Deployment

    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="SUCCESS"
          FAILED_STAGE="None"

          if [[ "${{ needs.Sonarqube-Scan.result }}" == "failure" ]]; then
            STATUS="FAILED"
            FAILED_STAGE="SonarQube Scan"

          elif [[ "${{ needs.Docker-Build-and-Push.result }}" == "failure" ]]; then
            STATUS="FAILED"
            FAILED_STAGE="Docker Build and Push"

          elif [[ "${{ needs.Trivy-Image-Scanning.result }}" == "failure" ]]; then
            STATUS="FAILED"
            FAILED_STAGE="Trivy Image Scan"

          elif [[ "${{ needs.Checkout-CD-Repo.result }}" == "failure" ]]; then
            STATUS="FAILED"
            FAILED_STAGE="GitOps Manifest Update"

          elif [[ "${{ needs.Staging-Verification.result }}" == "failure" ]]; then
            STATUS="FAILED"
            FAILED_STAGE="Staging Verification"

          elif [[ "${{ needs.Production-Deployment.result }}" == "failure" ]]; then
            STATUS="FAILED"
            FAILED_STAGE="Production Deployment"
          fi

          if [[ "$STATUS" == "SUCCESS" ]]; then
            MESSAGE="✅ CI/CD Pipeline Succeeded"
          else
            MESSAGE="🚨 CI/CD Pipeline Failed"
          fi

          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"$MESSAGE\n\nStage: $FAILED_STAGE\nStatus: $STATUS\n\n🔍 View Pipeline Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL"